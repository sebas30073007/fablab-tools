<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clips con manos · Fab Lab</title>
<meta name="description" content="Muestras de clips 3D con manos animadas para el tutorial de la CNC.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../../css/tokens.css">
<style>
  :root { --fondo: #f3f4f6; --panel: #ffffff; --texto: #111317; --suave: #6b6f76; --linea: #e5e7eb; --acento: var(--copper, #ff6b35); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font-family: Manrope, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-rows: 1fr auto; }
  #lienzo { position: relative; min-height: 0; }
  #lienzo canvas { display: block; width: 100%; height: 100%; }
  #subtitulo { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: calc(100% - 32px);
    background: rgba(17, 19, 23, .82); color: #fff; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 15px;
    text-align: center; transition: opacity .25s; }
  #subtitulo:empty { opacity: 0; }
  #paso { position: absolute; left: 16px; top: 14px; font-weight: 800; font-size: 13px; letter-spacing: .04em; color: var(--suave); text-transform: uppercase; }
  .controles { background: var(--panel); border-top: 1px solid var(--linea); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: grid; gap: 10px; }
  .clips { display: flex; gap: 8px; overflow-x: auto; align-items: center; }
  .clips .grupo { font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--suave); white-space: nowrap; padding-left: 6px; }
  .clips button, .fila button { font: inherit; font-weight: 700; font-size: 14px; border: 1px solid var(--linea); background: var(--panel);
    color: var(--texto); border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .clips button[aria-pressed="true"] { border-color: var(--texto); background: var(--texto); color: #fff; }
  .fila { display: flex; align-items: center; gap: 10px; }
  .fila input[type=range] { flex: 1; accent-color: var(--acento); }
  #tiempo { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--suave); min-width: 86px; text-align: right; }
  #grabar.activo { border-color: #e30613; color: #e30613; }
</style>
<script type="importmap">
{ "imports": {
  "three": "../../shared/vendor/three/three.module.min.js",
  "three/addons/": "../../shared/vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="lienzo"><div id="paso"></div><div id="subtitulo"></div></div>
<div class="controles">
  <div class="clips" id="clips"></div>
  <div class="fila">
    <button id="play" aria-label="Reproducir">▶</button>
    <input id="barra" type="range" min="0" max="1000" value="0" aria-label="Tiempo">
    <span id="tiempo">0.0 / 0.0 s</span>
    <button id="grabar" title="Graba el clip completo a un video .webm">Grabar</button>
  </div>
</div>
<script type="module" src="reproductor.js"></script>
</body>
</html>
