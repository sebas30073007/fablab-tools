<!doctype html>
<html lang="es" data-estilo="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escáner 3D · Fab Lab</title>
<meta name="description" content="Cómo escanear en 3D con el Creality Pika y el CR-Scan Otter: guía paso a paso de Creality Scan, ajustes por tipo de pieza y qué exportar para abrirlo en el Visor 3D.">
<!-- Jerarquía SEBS: capa 0 (tokens) → capa 1 (chrome) → capa 2 (project) → capa 3 (shared/css + escaner) -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/chrome.css">
<link rel="stylesheet" href="../css/project.css">
<link rel="stylesheet" href="../shared/css/app.css">
<link rel="stylesheet" href="../visor3d/visor3d.css">
<link rel="stylesheet" href="escaner.css">
<link rel="stylesheet" href="../shared/css/lab.css">
<script type="importmap">
{ "imports": {
  "three": "../shared/vendor/three/three.module.min.js",
  "three/addons/": "../shared/vendor/three/addons/"
} }
</script>
</head>
<body>
<div class="app">
  <header class="barra" aria-label="Barra superior">
    <a class="barra__marca" href="../" aria-label="Fab Lab: volver al catálogo">
      <img src="../img/simbolo.png" alt="" width="24" height="24" onerror="this.remove()">
      <span class="barra__nombre">Fab Lab</span>
    </a>
    <span class="barra__sep" aria-hidden="true"></span>
    <h1 class="barra__app">Escáner 3D</h1>
    <nav class="seg seg--equipo" aria-label="Escáner">
      <a href="?equipo=pika" data-equipo="pika">Pika</a>
      <a href="?equipo=otter" data-equipo="otter">Otter</a>
    </nav>
    <span class="barra__acc">
      <a class="btn-tutorial" href="../visor3d/"><svg class="ico" aria-hidden="true"><use href="#i-cubo"/></svg><span class="btn-tutorial__txt">Visor 3D</span></a>
    </span>
  </header>

  <main class="visor" id="visor" aria-label="Gemelo 3D del escáner">
    <div class="seg seg--flota" role="radiogroup" aria-label="Luz" id="modos">
      <button role="radio" data-modo="apagado" aria-checked="true">Apagado</button>
      <button role="radio" data-modo="laser" aria-checked="false" id="m-luz">Láser azul</button>
      <button role="radio" data-modo="nir" aria-checked="false">NIR</button>
    </div>
    <div class="flota-der">
      <button type="button" class="btn-flota" data-vista="mesa" aria-label="Ver la mesa" title="Mesa"><svg class="ico" aria-hidden="true"><use href="#i-agrandar"/></svg></button>
      <button type="button" class="btn-flota" data-vista="escaner" aria-label="Ver el escáner" title="Escáner"><svg class="ico" aria-hidden="true"><use href="#i-escaner"/></svg></button>
    </div>
    <button type="button" class="btn-visor" id="btn-visor" aria-pressed="false" aria-label="Agrandar vista 3D"><svg class="ico" aria-hidden="true"><use href="#i-agrandar"/></svg></button>
  </main>

  <aside class="panel" aria-label="Guía">
    <div class="panel__vista" id="vista"></div>
    <nav class="navinf" aria-label="Secciones">
      <div class="navinf__pildora">
        <button data-tab="inicio" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-casa-on"/></svg><span>Guía</span></button>
        <button data-tab="ajustes"><svg class="ico" aria-hidden="true"><use href="#i-interfaz"/></svg><span>Ajustes</span></button>
        <button data-tab="exportar"><svg class="ico" aria-hidden="true"><use href="#i-bajar"/></svg><span>Exportar</span></button>
      </div>
      <a class="navinf__mas" href="../visor3d/" aria-label="Abrir el Visor 3D"><svg class="ico" aria-hidden="true"><use href="#i-cubo"/></svg></a>
    </nav>
    <div class="hojas" id="hojas"></div>
    <div class="sr-only" id="anuncio" aria-live="polite"></div>
  </aside>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
