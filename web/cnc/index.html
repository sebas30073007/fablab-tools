<!doctype html>
<html lang="es" data-estilo="lab">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CNC · Fab Lab</title>
<meta name="description" content="Control de la CNC Genmitsu Cubiko desde el navegador: de los Gerber de KiCad a la placa fresada, con calibración guiada y gemelo 3D.">
<!-- Jerarquía SEBS: capa 0 (tokens) → capa 1 (chrome) → capa 2 (project) → capa 3 (cnc + lab) -->
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/chrome.css">
<link rel="stylesheet" href="../css/project.css">
<link rel="stylesheet" href="cnc.css">
<link rel="stylesheet" href="lab.css">
<link rel="stylesheet" href="tutorial.css">
<script>try { const e = JSON.parse(localStorage.getItem("fablab.cnc.estilo")); if (e) document.documentElement.dataset.estilo = e; } catch (_) {}</script>
<script type="importmap">
{ "imports": {
  "three": "../shared/vendor/three/three.module.min.js",
  "three/addons/": "../shared/vendor/three/addons/"
} }
</script>
</head>
<body>
<!-- Un set de íconos: trazo 1.8, caja 24, lineal. Los rellenos solo marcan selección. -->

  <symbol id="i-mover" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3 9.5 5.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></symbol>
  <symbol id="i-consola" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m7 10 3 2-3 2M12.5 15H17"/></symbol>
  <symbol id="i-mas" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-atras" viewBox="0 0 24 24"><path d="M15 5.5 8.5 12l6.5 6.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></symbol>
  <symbol id="i-ok" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>

  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></symbol>

  <symbol id="i-mira" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><path d="M12 2.5v5M12 16.5v5M2.5 12h5M16.5 12h5"/></symbol>

<div class="app">
  <!-- ================= Barra: solo marca y PARO ================= -->
  <header class="barra" aria-label="Barra superior">
    <a class="barra__marca" href="../" aria-label="Fab Lab: volver al catálogo">
      <img src="../img/simbolo.png" alt="" width="24" height="24" onerror="this.remove()">
      <span class="barra__nombre">Fab Lab</span>
    </a>
    <span class="barra__sep" aria-hidden="true"></span>
    <h1 class="barra__app">CNC</h1>
    <button type="button" class="btn-tutorial" id="btn-tutorial" data-tour="tutorial" aria-label="Tutorial"><svg class="ico" aria-hidden="true"><use href="#i-libro"/></svg><span class="btn-tutorial__txt" aria-hidden="true">Tutorial</span></button>
    <button class="btn-paro" id="btn-paro" data-tour="paro" disabled aria-keyshortcuts="Escape" title="Esc">PARO</button>
  </header>

  <!-- ================= Visor ================= -->
  <main class="visor" id="visor" data-tour="visor" aria-label="Gemelo 3D de la máquina">
    <div class="visor__coords" aria-hidden="true" data-tour="coords">
      <span class="pildora-dato" data-eje="X"><b>X</b><span id="wx">—</span></span>
      <span class="pildora-dato" data-eje="Y"><b>Y</b><span id="wy">—</span></span>
      <span class="pildora-dato" data-eje="Z"><b>Z</b><span id="wz">—</span></span>
      <span class="pildora-dato pildora-dato--sonda" id="sonda-visor" hidden><i class="punto"></i>Contacto</span>
    </div>
    <div class="seg seg--flota" role="radiogroup" aria-label="Vista" id="vistas" data-tour="vistas">
      <button role="radio" data-vista="3d" aria-checked="true">3D</button>
      <button role="radio" data-vista="arriba" aria-checked="false">Arriba</button>
      <button role="radio" data-vista="frente" aria-checked="false">Frente</button>
    </div>
    <button type="button" class="btn-visor" id="btn-visor" aria-pressed="false" aria-label="Agrandar vista 3D"><svg class="ico" aria-hidden="true"><use href="#i-agrandar"/></svg></button>
    <div class="soltar" id="soltar" hidden><div>Suelta los Gerber, el .drl o el .nc</div></div>
  </main>

  <!-- ================= Panel: una app móvil al lado del 3D ================= -->
  <aside class="panel" aria-label="Controles" data-tour-zona>
    <div class="panel__vista" id="vista"></div>
    <nav class="navinf" aria-label="Secciones">
      <div class="navinf__pildora">
        <button data-tab="inicio" aria-current="page"><svg class="ico" aria-hidden="true"><use href="#i-casa-on"/></svg><span>Inicio</span></button>
        <button data-tab="mover"><svg class="ico" aria-hidden="true"><use href="#i-mover"/></svg><span>Mover</span></button>
        <button data-tab="consola"><svg class="ico" aria-hidden="true"><use href="#i-consola"/></svg><span>Consola</span></button>
      </div>
      <button class="navinf__mas" id="btn-mas" data-tour="mas" aria-label="Acciones rápidas"><svg class="ico" aria-hidden="true"><use href="#i-mas"/></svg></button>
    </nav>
    <div class="hojas" id="hojas"></div>
    <div class="sr-only" id="anuncio" aria-live="polite"></div>
  </aside>
</div>

<input type="file" id="archivos" multiple accept=".gbr,.gtl,.gbl,.gko,.gm1,.drl,.xln,.gbrjob,.nc,.gcode,.ngc,.tap,.txt,.map" hidden>

<script type="module" src="js/main.js"></script>
</body>
</html>
